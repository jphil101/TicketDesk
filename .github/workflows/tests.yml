name: Tests
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: UTC
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Create test databases
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c 'create database ticketdesk_test' -c 'create database ticketdesk_e2e'
      - name: Server tests
        run: npm test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/ticketdesk_test
      - name: Install browser
        run: npm install --no-save playwright@1.63.0 && npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm run e2e
        env:
          E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5432/ticketdesk_e2e
